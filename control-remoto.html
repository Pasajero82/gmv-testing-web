<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMV REMOTE</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        /* STATUS BADGE */
	/* TOP STATUS BAR */
        .top-status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            letter-spacing: 1px;
            z-index: 100;
        }

	.user-info {
    	color: #ff0055; /* Rosa para el prefijo USER: */
    	font-weight: 600;
	}

	#remote-username {
    	color: #00ccff; /* Cyan para que el nombre resalte */
	}

	.level-tag {
    	color: #ff0055; /* Rosa para los corchetes y el nivel */
    	margin-left: 5px;
    	font-weight: 700;
	}

        /* Color cuando esté conectado */
        .top-status-bar.online-mode #status {
            color: #00ccff;
            text-shadow: 0 0 8px rgba(0,204,255,0.4);
        }

        /* REMOTE BODY */
        .remote {
            width: 100%;
            max-width: 340px;
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            border-radius: 35px;
            margin-top: 20px; 
    	    padding: 20px 25px 25px; 
    	    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    	    margin-bottom: 20px;
}

        /* D-PAD SECTION */
        .dpad-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
        }

        .dpad-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #0d0d0d, #000);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dpad-btn:active {
            background: #00ccff;
            border-color: #00ccff;
            box-shadow: 0 0 20px rgba(0,204,255,0.6);
        }

        .dpad-btn svg {
            width: 22px;
            height: 22px;
            fill: rgba(255,255,255,0.7);
            transition: fill 0.15s;
        }

        .dpad-btn:active svg {
            fill: #000;
        }

        /* Posiciones del D-pad */
        .dpad-up { top: 10px; left: 50%; transform: translateX(-50%); }
        .dpad-left { left: 10px; top: 50%; transform: translateY(-50%); }
        .dpad-right { right: 10px; top: 50%; transform: translateY(-50%); }
        .dpad-down { bottom: 10px; left: 50%; transform: translateX(-50%); }

        .dpad-up:active { transform: translateX(-50%); }
        .dpad-left:active { transform: translateY(-50%); }
        .dpad-right:active { transform: translateY(-50%); }
        .dpad-down:active { transform: translateX(-50%); }

        /* BOTÓN CENTRAL PLAY/PAUSE */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff0055, #cc0044);
            border: none;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,0,85,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .play-btn:active {
            transform: translate(-50%, -50%);
            box-shadow: 0 0 35px rgba(255,0,85,0.8);
            background: linear-gradient(135deg, #ff0066, #ff0055);
        }

        .play-btn svg {
            width: 26px;
            fill: #fff;
        }

        /* FUNCTION BUTTONS GRID */
        .func-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .func-btn {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .func-btn:active {
            background: #00ccff;
            border-color: #00ccff;
            box-shadow: 0 0 20px rgba(0,204,255,0.5);
        }

        .func-btn svg {
            width: 20px;
            height: 20px;
            fill: rgba(255,255,255,0.7);
            transition: fill 0.15s;
        }

        .func-btn:active svg {
            fill: #000;
        }

        .func-btn .label {
            font-size: 0.6rem;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.3px;
            transition: color 0.15s;
        }

        .func-btn:active .label {
            color: #000;
        }

        .func-btn .key-num {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.2);
            transition: color 0.15s;
        }

        .func-btn:active .key-num {
            color: rgba(0,0,0,0.3);
        }

        /* FAV BUTTON - HIGHLIGHT CON ROSA */
        .func-btn.fav:active {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
        }

        .func-btn.fav:active svg,
        .func-btn.fav:active .label,
        .func-btn.fav:active .key-num {
            color: #fff;
            fill: #fff;
        }

        /* ESC BUTTON - DESTACADO CON ROSA */
        .func-btn.esc {
            background: rgba(255,0,85,0.1);
            border-color: rgba(255,0,85,0.3);
        }

        .func-btn.esc svg {
            fill: #ff0055;
        }

        .func-btn.esc .label {
            color: #ff0055;
        }

        .func-btn.esc:active {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
        }

        .func-btn.esc:active svg,
        .func-btn.esc:active .label {
            fill: #fff;
            color: #fff;
        }

        /* INFO PANEL */
        .info-panel {
            width: 100%;
            max-width: 340px;
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .info-header {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #00ccff;
            border-bottom-color: #00ccff;
        }

	.info-content {
            padding: 15px 20px;
            height: 280px; /* Altura fija para que el scroll funcione */
            overflow-y: scroll; /* Permite deslizar hacia abajo para ver todos los logros */
	    -webkit-overflow-scrolling: touch;
        }
	/* 2. EL ESTILO DE LA BARRA (Lo que la hace visible) */
        .info-content::-webkit-scrollbar {
            width: 6px;
        }
        .info-content::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }

        .stat-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: #00ccff;
        }

        /* KEYBOARD OVERLAY */
        .keyboard-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .keyboard-overlay.show {
            display: flex;
        }

        .keyboard-box {
            width: 100%;
            max-width: 340px;
        }

        .keyboard-title {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #ff0055;
            margin-bottom: 20px;
            text-align: center;
        }

        .keyboard-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 2px solid #00ccff;
            color: white;
            padding: 16px;
            font-size: 1rem;
            border-radius: 15px;
            outline: none;
            text-align: center;
        }

        .keyboard-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .kbd-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .kbd-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .kbd-btn.cancel:active {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .kbd-btn.send {
            background: #ff0055;
            color: white;
        }

        .kbd-btn.send:active {
            background: #ff0066;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
        }

	/* 1. Contenedor de la canción (Entre Status y D-pad) */
/* CONTENEDOR DE LA MARQUESINA */
.now-playing-info {
    width: 100%;
    margin: 0 0 20px 0;
    padding: 5px 0;
    background: rgba(0, 0, 0, 0.3); /* Fondo un poco más oscuro para la "pantalla" */
    border-radius: 5px;
    overflow: hidden; /* Corta el texto que se sale del ancho */
    white-space: nowrap;
    position: relative;
    display: flex;
    align-items: center;
}

/* TEXTO LED CON ANIMACIÓN */
#current-track-name {
    display: inline-block;
    font-family: 'DotGothic16', sans-serif;
    font-size: 1.5rem; /* El doble de lo anterior (era 0.7rem) */
    color: #00ccff;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-left: 100%; /* Empieza fuera de la pantalla a la derecha */
    animation: marquee-led 10s linear infinite; /* Movimiento continuo */
    text-shadow: 0 0 8px rgba(0, 204, 255, 0.6);
}

/* LA ANIMACIÓN DE MOVIMIENTO */
@keyframes marquee-led {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}

/* 2. Rediseño del botón ESC (Pequeño y elegante) */
.esc-row {
    display: flex;
    justify-content: center;
    margin: 10px 0 25px; /* Espacio entre D-pad y Funciones */
}

.esc-pill {
    background: rgba(255, 0, 85, 0.05);
    border: 1px solid #ff0055;
    color: #ff0055;
    padding: 4px 20px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
}

.esc-pill:active {
    background: #ff0055;
    color: white;
    box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
}
    </style>
</head>

    <div class="keyboard-overlay" id="keyboardOverlay">

            <input type="text" id="muroInput" class="keyboard-input" placeholder="TYPE MESSAGE..." maxlength="100">
            <div class="keyboard-actions">
                <button class="kbd-btn cancel" onclick="closeKeyboard()">CANCEL</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://gmv-server.onrender.com');
        const urlParams = new URLSearchParams(window.location.search);
        let roomID = urlParams.get('room');

        // Unión a sala
        if (!roomID) {
            console.error("⚠️ No Room ID!");
            document.getElementById('status').innerText = 'ERROR: NO ROOM';
        } else {
            socket.emit('join-room', roomID);
        }

        // Función para enviar comandos
        function send(cmd) {
            if (!roomID) return;
            console.log("📤 Enviando:", cmd);
            socket.emit('enviar-comando', { cmd, room: roomID, time: Date.now() });
            if (navigator.vibrate) navigator.vibrate(35);
        }

        function openKeyboard() {
            document.getElementById('keyboardOverlay').classList.add('show');
            setTimeout(() => document.getElementById('muroInput').focus(), 100);
        }

        function closeKeyboard() {
            document.getElementById('keyboardOverlay').classList.remove('show');
            document.getElementById('muroInput').value = '';
        }

        function sendToWall() {
            const texto = document.getElementById('muroInput').value.trim();
            if (texto && roomID) {
                socket.emit('enviar-comando', { 
                    cmd: 'muro-broadcast', 
                    texto: texto.toUpperCase(), 
                    room: roomID 
                });
                closeKeyboard();
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }
        }

        document.getElementById('muroInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendToWall();
        });

        // Eventos de conexión
	socket.on('connect', () => {
        console.log("✅ Socket Conectado");
        // Agregamos la clase al contenedor principal para activar los colores
        document.querySelector('.top-status-bar').classList.add('online-mode');
        document.getElementById('status').innerText = 'ONLINE : ' + (roomID || 'SEARCHING...');
        
        setTimeout(() => {
            if(roomID) send('sync');
        }, 600);
    });

        socket.on('disconnect', () => {
            document.getElementById('status').className = 'status';
            document.getElementById('status').innerText = 'OFFLINE';
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            
            const activeTab = Array.from(document.querySelectorAll('.tab')).find(t => t.innerText.toLowerCase() === tab.toLowerCase());
            if (activeTab) activeTab.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // RECEPTOR DE LA CANCIÓN
        socket.on('ejecutar-comando', (data) => {
	// --- RECEPTOR DE USUARIO, STATS Y LOGROS (CORREGIDO) ---
        if (data.cmd === 'update-user-data') {
            const userEl = document.getElementById('remote-username');
            const levelTopEl = document.getElementById('remote-level');
            const videosEl = document.getElementById('remote-videos');
            const timeEl = document.getElementById('remote-time');
            const streakEl = document.getElementById('remote-streak');
            const levelStatsEl = document.getElementById('remote-level-stats');
            const achListEl = document.getElementById('remote-achievements-list');

            if (userEl) userEl.innerText = data.username;
            if (levelTopEl) levelTopEl.innerText = "[" + data.level + "]";
            if (videosEl) videosEl.innerText = data.totalVideos;
            if (timeEl) timeEl.innerText = data.watchTime;
            if (streakEl) streakEl.innerText = data.streak + " days";
            if (levelStatsEl) levelStatsEl.innerText = data.level;

            // DIBUJAR LOGROS DINÁMICAMENTE
            if (achListEl && data.achievements) {
                achListEl.innerHTML = ''; // Limpiar "Waiting for data..."
                data.achievements.forEach(ach => {
                    const item = document.createElement('div');
                    item.className = 'stat-item';
                    item.innerHTML = `
                        <span class="stat-label">${ach.icon} ${ach.name}</span>
                        <span class="stat-value">${ach.unlocked ? '✓' : '🔒'}</span>
                    `;
                    achListEl.appendChild(item);
                });
            }
            return;
        }

        // ------------------------------------
            if (data.cmd === 'update-track') {
                const trackDisplay = document.getElementById('current-track-name');
                if (trackDisplay && data.title && data.artist) {
                    trackDisplay.innerText = `${data.artist} - ${data.title}`.toUpperCase();
                }
            }
        });
    </script>
</body>
</html>
